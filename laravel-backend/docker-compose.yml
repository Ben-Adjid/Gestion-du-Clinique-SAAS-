version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clinic_app
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "8000:80"
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=clinic_db
      - DB_USERNAME=clinic_user
      - DB_PASSWORD=SecurePass@12345
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - db
      - redis
    networks:
      - clinic-network

  db:
    image: mysql:8.0
    container_name: clinic_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: clinic_db
      MYSQL_ROOT_PASSWORD: RootPass@12345
      MYSQL_PASSWORD: SecurePass@12345
      MYSQL_USER: clinic_user
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - clinic-network

  redis:
    image: redis:7-alpine
    container_name: clinic_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - clinic-network

  frontend:
    image: node:18-alpine
    container_name: clinic_frontend
    working_dir: /app
    volumes:
      - ../react-frontend:/app
    ports:
      - "3000:3000"
    command: npm run dev
    networks:
      - clinic-network

volumes:
  dbdata:
    driver: local

networks:
  clinic-network:
    driver: bridge
